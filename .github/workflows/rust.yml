name: Rust CI

on:
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'default.nix'
      - 'nixpkgs/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'default.nix'
      - 'nixpkgs/**'
      - '.github/workflows/rust.yml'

jobs:
  ci:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: base91
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        continue-on-error: true

      # Every attribute evaluates without building anything first (spec
      # 0012 §4): no import from derivation.
      - name: evaluate (no IFD)
        run: nix-instantiate default.nix --option allow-import-from-derivation false > /dev/null

      - name: cargo fmt
        run: nix-build default.nix -A rust-fmt

      - name: cargo clippy
        run: nix-build default.nix -A rust-clippy

      # The seed of the randomized tests derives from the commit (spec 0009),
      # so a rerun of this commit tests the same cases.
      - name: cargo test
        run: nix-build default.nix -A rust-tests --argstr testSeed "${{ github.sha }}"

      # no_std builds (spec 0004 §7): host, wasm32v1-none, AVX2 branch, and
      # aarch64 cross-compiled.
      - name: cargo no_std
        run: nix-build default.nix -A rust-nostd

      - name: cargo no_std (aarch64)
        run: nix-build default.nix -A rust-nostd-aarch64

      # aarch64 (NEON kernels) under qemu user-mode (spec 0009 §8). The
      # first run builds nixpkgs' cross rustc (about 8 minutes); Cachix keeps
      # it for later runs.
      - name: cargo test (aarch64, qemu)
        run: nix-build default.nix -A rust-tests-aarch64 --argstr testSeed "${{ github.sha }}"

      # The staged nixpkgs recipe, built from the local source (spec 0012):
      # what a nixpkgs PR submits. Its check phase runs the CLI's tests.
      - name: base91 (staged nixpkgs recipe)
        run: nix-build default.nix -A base91

      # nixfmt and version of the staged files (spec 0012 §6).
      - name: nixpkgs staging check
        run: nix-build default.nix -A nixpkgs-staging-check

      - name: cargo test (full matrix)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: nix-build default.nix -A rust-tests-full --argstr testSeed "${{ github.sha }}"

  # Relative performance (spec 0009 §10), in its own job so that a noisy
  # runner cannot block the correctness job. Asserts ratios between SIMD
  # levels and layouts, not absolute speed.
  perf:
    name: perf (relative)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: base91
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        continue-on-error: true

      - name: cargo test (perf_sanity)
        run: nix-build default.nix -A rust-perf
