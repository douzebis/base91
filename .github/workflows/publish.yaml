# Publish a release: base91-testkit, base91-rs and base91-cli to crates.io,
# pybase91 to PyPI (spec 0013 §5).
#
# A pushed tag v* starts it.  `check-version` checks the tag against the Cargo
# version.  `crates` packages and tests the crates from their .crate files
# (artifact `crates`); `wheels` and `sdist` build pybase91 (artifacts
# `wheels-*`).  Inspect the artifacts, then approve the uploads: each publish
# job runs in an environment (`crates-io`, `pypi`) that requires the
# maintainer's approval and only accepts v* tags (repository settings).
# Both authenticate with trusted publishing: no stored secret.
#
# The uploads are resumable: a crate already published at this version is
# skipped, and so is a file already on PyPI, so if one fails halfway,
# re-running its job finishes the release.

name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check the tag against the Cargo version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("rust/Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          case "$version" in
            *-dev)
              echo "::error::rust/Cargo.toml has development version $version"
              exit 1
              ;;
          esac
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::ref $GITHUB_REF_NAME does not match version $version (rust/Cargo.toml)"
            exit 1
          fi

  crates:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Package and test the crates
        run: nix-shell default.nix -A release-shell --run scripts/check-crates

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crates
          path: rust/target/package/*.crate

  wheels:
    name: Build wheels — ${{ matrix.target }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (manylinux)
          - os: ubuntu-latest
            target: x86_64
          # Linux aarch64 (native ARM runner)
          - os: ubuntu-24.04-arm
            target: aarch64
          # macOS x86_64
          - os: macos-latest
            target: x86_64
          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: rust/base91
          target: ${{ matrix.target }}
          args: --release --out dist --features python -i python3.11 python3.12 python3.13
          manylinux: 2_36

      # Every wheel must contain the compiled extension module (spec 0004
      # §7): if maturin misdetects the bindings it silently builds a "bin"
      # wheel without it.
      - name: Check wheels contain the extension module and its type stub
        shell: bash
        working-directory: rust/base91
        run: |
          for wheel in dist/*.whl; do
            python -c "import sys, zipfile; names = zipfile.ZipFile(sys.argv[1]).namelist(); sys.exit(0 if any(n.startswith('pybase91/pybase91') and n.endswith(('.so', '.pyd')) for n in names) else 1)" "$wheel" \
              || { echo "no extension module in $wheel"; exit 1; }
            python -c "import sys, zipfile; names = set(zipfile.ZipFile(sys.argv[1]).namelist()); sys.exit(0 if {'pybase91/__init__.pyi', 'pybase91/py.typed'} <= names else 1)" "$wheel" \
              || { echo "no type stub in $wheel"; exit 1; }
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: rust/base91/dist

  sdist:
    name: Build source distribution
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: rust/base91
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: rust/base91/dist

  publish-crates:
    name: Publish to crates.io
    needs: crates
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # `crates` already built and tested the packages from the same tagged
      # source and lock file, so the upload does not build them again.
      - name: Publish base91-testkit, base91-rs, then base91-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: nix-shell default.nix -A release-shell --run scripts/publish-crates

  # Waits for `crates` too: a release whose crates fail their checks is not
  # published anywhere.
  publish-pypi:
    name: Publish to PyPI
    needs: [wheels, sdist, crates]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pybase91/
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          # Files already on PyPI are skipped, so a re-run finishes a
          # half-done upload.
          skip-existing: true
