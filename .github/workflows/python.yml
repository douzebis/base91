name: Python

on:
  push:
    branches: [main]
    paths:
      - 'rust/base91/**'
      - 'rust/Cargo.toml'
      - 'rust/Cargo.lock'
      - 'default.nix'
      - 'nixpkgs/**'
      - '.github/workflows/python.yml'
  pull_request:
    paths:
      - 'rust/base91/**'
      - 'rust/Cargo.toml'
      - 'rust/Cargo.lock'
      - 'default.nix'
      - 'nixpkgs/**'
      - '.github/workflows/python.yml'

jobs:
  build:
    name: maturin build (pybase91)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: base91
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        continue-on-error: true

      # The staged nixpkgs recipe, built from the local source (spec 0012):
      # imports the extension and runs the Python tests.
      - name: build pybase91
        run: nix-build default.nix -A pybase91

      # The committed type stub matches the generator (spec 0012 §2).
      - name: pybase91 stub check
        run: nix-build default.nix -A pybase91-stub-check
