name: C

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'rust/**'
      - 'default.nix'
      - 'nixpkgs/**'
      - '.github/workflows/c.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'rust/**'
      - 'default.nix'
      - 'nixpkgs/**'
      - '.github/workflows/c.yml'

jobs:
  build:
    name: libbase91
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: base91
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        continue-on-error: true

      # The C library built from base91-rs (spec 0014), its Rust tests in
      # the check phase, then its C-side tests: every function through
      # pkg-config (dynamic and static), and Henke's basE91 0.6.0 tool
      # linked against it.
      - name: build libbase91 and its tests
        run: >
          nix-build default.nix
          -A libbase91
          -A libbase91.tests.c-api
          -A libbase91.tests.henke-compat
          -A libbase91.tests.pkg-config
