version = 1


[[annotations]]
path = "./*"
SPDX-FileCopyrightText = "2025 Frederic Ruget <fred@atlant.is> (GitHub: @douzebis)"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["rust/Cargo.lock", "rust/rust_out", "rust/target/**"]
SPDX-FileCopyrightText = "2026 Frederic Ruget <fred@atlant.is> (GitHub: @douzebis)"
SPDX-License-Identifier = "MIT"

# Files staged for nixpkgs: copied there verbatim, so they carry no header
# (spec 0012 §1).
[[annotations]]
path = "nixpkgs/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Frederic Ruget <fred@atlant.is> (GitHub: @douzebis)"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "rust/base91/tests/fixtures/**"
SPDX-FileCopyrightText = "2006 Joachim Henke"
SPDX-License-Identifier = "BSD-3-Clause"

# Upstream basE91 0.6.0, vendored unmodified as the legacy-format test
# oracle (spec 0009). Provenance: rust/base91-testkit/reference/basE91-0.6.0/PROVENANCE
[[annotations]]
path = [
    "rust/base91-testkit/reference/basE91-0.6.0/base91.c",
    "rust/base91-testkit/reference/basE91-0.6.0/base91.h",
    "rust/base91-testkit/reference/basE91-0.6.0/cli.c",
    "rust/base91-testkit/reference/basE91-0.6.0/LICENSE",
]
SPDX-FileCopyrightText = "2000-2006 Joachim Henke"
SPDX-License-Identifier = "BSD-3-Clause"

# Fuzz corpus (spec 0009 §6): generated binary inputs, no room for headers.
[[annotations]]
path = "rust/base91/fuzz/corpus/**"
SPDX-FileCopyrightText = "2026 Frederic Ruget <fred@atlant.is> (GitHub: @douzebis)"
SPDX-License-Identifier = "MIT"
