[package]
name        = "base91-rs"
version.workspace = true
edition     = "2021"
rust-version = "1.91"
description = "basE91 binary-to-text encoding — fast, no_std-compatible Rust implementation"
license     = "MIT"
repository  = "https://github.com/douzebis/base91"
readme      = "README.md"
keywords    = ["base91", "encoding", "binary-to-text", "codec"]
categories  = ["encoding"]

[lib]
name = "base91"
# No crate-type: the default rlib only. A cdylib here would be built even
# when base91-rs is a dependency, and breaks no_std / default-features = false
# builds downstream (spec 0004 §6). maturin builds the Python extension's
# cdylib itself (pyproject.toml: bindings = "pyo3").

[[bin]]
name = "post_build"
path = "src/bin/post_build.rs"
required-features = ["python"]

[[bench]]
name    = "throughput"
harness = false

[features]
# std ⊃ alloc ⊃ core (spec 0004 §1). Without default features the crate is
# no_std; `alloc` adds the Vec-based API.
default        = ["std", "io"]
std            = ["alloc"]
alloc          = []
io             = ["std"]
python         = ["std", "pyo3", "pyo3-stub-gen", "pyo3-stub-gen-derive"]
# Enables the C reference benchmarks and c-compat unit tests.
# Requires gcc, objcopy, and ar on PATH, and src/base91.{c,h} two levels up.
# Never enabled by default; not part of the published crate.
c-compat-tests = ["dep:cc"]
# Force scalar path even when SIMD is available (useful for benchmarking).
force-scalar = []
# Enables the tests against the vendored, unmodified upstream basE91 0.6.0
# (the legacy-format oracle, built by base91-testkit; spec 0009). Needs a C
# compiler; enabled by the Nix test attributes, never by default.
reference-tests = ["base91-testkit/reference"]

[dependencies]
pyo3                 = { version = "0.26", features = ["extension-module"], optional = true }
pyo3-stub-gen        = { version = "0.20", optional = true }
pyo3-stub-gen-derive = { version = "0.20", optional = true }

[dev-dependencies]
criterion  = { version = "0.5", features = ["html_reports"] }
rand       = { version = "0.8", features = ["small_rng"] }
sha2       = "0.10"
base91-dnsl48 = { package = "base91", version = "0.1" }
base91-testkit = { path = "../base91-testkit" }
proptest   = { version = "1", default-features = false, features = ["std"] }

[build-dependencies]
cc = { version = "1", optional = true }
