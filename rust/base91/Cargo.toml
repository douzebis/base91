[package]
name        = "base91-rs"
version.workspace = true
edition     = "2021"
rust-version = "1.91"
description = "base91, but faster: a SIMD variant at 25× the speed"
license     = "MIT"
repository  = "https://github.com/douzebis/base91"
readme      = "README.md"
keywords    = ["base91", "simd", "encoding", "binary-to-text", "no-std"]
categories  = ["encoding", "no-std", "no-std::no-alloc"]

[lib]
name = "base91"
# No crate-type: the default rlib only. A cdylib here would be built even
# when base91-rs is a dependency, and breaks no_std / default-features = false
# builds downstream (spec 0004 §6). maturin builds the Python extension's
# cdylib itself (pyproject.toml: bindings = "pyo3").

[[bin]]
name = "post_build"
path = "src/bin/post_build.rs"
required-features = ["python"]

[features]
# std ⊃ alloc ⊃ core (spec 0004 §1). Without default features the crate is
# no_std; `alloc` adds the Vec-based API.
default        = ["std", "io"]
std            = ["alloc"]
alloc          = []
io             = ["std"]
python         = ["std", "pyo3", "pyo3-stub-gen", "pyo3-stub-gen-derive"]
# The Python extension module itself: maturin builds with it (pyproject.toml).
# pyo3's extension-module leaves libpython unlinked, as an extension must;
# the stub generator (post_build, `--features python` alone) links it, since
# pyo3-stub-gen renders default argument values with a real interpreter.
extension-module = ["python", "pyo3/extension-module"]
# Force scalar path even when SIMD is available (useful for benchmarking).
force-scalar = []
# Enables the tests against the vendored, unmodified upstream basE91 0.6.0
# (the legacy-format oracle, built by base91-testkit; spec 0009). Needs a C
# compiler; enabled by the Nix test attributes, never by default.
reference-tests = ["base91-testkit/reference"]

[dependencies]
pyo3                 = { version = "0.26", optional = true }
pyo3-stub-gen        = { version = "0.20", optional = true }
pyo3-stub-gen-derive = { version = "0.20", optional = true }

[dev-dependencies]
sha2       = "0.10"
base91-testkit = { workspace = true }
proptest   = { version = "1", default-features = false, features = ["std"] }
