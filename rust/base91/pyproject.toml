[build-system]
requires      = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name            = "pybase91"
version         = "0.3.0"
description     = "basE91 binary-to-text encoding — Python extension (Rust/PyO3)"
license         = { text = "MIT" }
requires-python = ">=3.11"

[tool.maturin]
# Required since Cargo.toml declares no cdylib (spec 0004 §6): without it,
# maturin sees the post_build binary and silently builds a "bin" wheel with
# no extension module.
bindings      = "pyo3"
features      = ["python"]
module-name   = "pybase91.pybase91"
