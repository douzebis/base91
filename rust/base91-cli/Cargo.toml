[package]
name        = "base91-cli"
version.workspace = true
edition     = "2021"
rust-version = "1.91"
description = "base91, but faster: the command-line encoder and decoder, with a SIMD variant at 25× the speed"
license     = "MIT"
repository  = "https://github.com/douzebis/base91"

[[bin]]
name = "base91"
path = "src/main.rs"

[dependencies]
base91        = { workspace = true, features = ["std", "io"] }
clap          = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen   = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Compares the CLI with upstream basE91 0.6.0's own command-line tool, built
# by base91-testkit (spec 0009 §9). Needs a C compiler; enabled by the Nix
# test attributes, never by default.
reference-tests = ["base91-testkit/reference"]

[dev-dependencies]
tempfile = "3"
base91-testkit = { workspace = true }
