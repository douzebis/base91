[workspace]
members  = ["base91", "base91-cli", "base91-testkit", "base91/fuzz"]
resolver = "2"

# The one version of base91-rs, base91-cli and pybase91 (spec 0012 §5).
# Between releases: the next version with a -dev suffix. The version of
# base91-rs below must say the same: crates.io needs a version on the path
# dependency, and cargo cannot take it from workspace.package.
[workspace.package]
version = "0.3.2-dev"

[workspace.dependencies]
base91 = { package = "base91-rs", path = "base91", version = "0.3.2-dev", default-features = false }
